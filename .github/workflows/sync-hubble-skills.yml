name: Sync upstream Hubble skills

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:skills

      - name: Open or update sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- skills; then
            echo "Skills are already current."
            exit 0
          fi

          branch="automation/sync-hubble-skills"
          commit="$(node -p "require('./skills/upstream.json').commit")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add skills
          git commit -m "chore(skills): sync Hubble skills"
          git push --force origin "$branch"

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --title "chore(skills): sync upstream Hubble skills" \
              --body "Syncs the vendored Hubble HTML App skills to upstream commit \`$commit\`."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch" \
              --title "chore(skills): sync upstream Hubble skills" \
              --body "Syncs the vendored Hubble HTML App skills to upstream commit \`$commit\`."
          fi
